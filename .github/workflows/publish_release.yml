name: Build and push the release image

on:
    push:
        branches:
            - release

jobs:
    run-pre-checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
            - run: |
                  sudo bash -c "mkdir /captain && chown -R `whoami` /captain"
                  npm ci
                  npm run build
                  npm run lint
                  npm run formatter
                  npm run test
    build-publish-docker-hub:
        needs: run-pre-checks
        runs-on: ubuntu-latest
        steps:
            - uses: azure/docker-login@v1
              with:
                  username: ${{ secrets.REGISTRY_USERNAME }}
                  password: ${{ secrets.REGISTRY_PASSWORD }}
            - uses: actions/checkout@v1
            - name: Build and Push Release to DockerHub
              shell: bash
              run: ./release/build-and-push.sh release
    draft-github-release:
        needs: build-publish-docker-hub
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Create draft GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: ./release/create-draft-release.sh
