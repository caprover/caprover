name: Test draft release automation

on:
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    test-draft-release:
        if: github.event.pull_request.number == 2469 && github.event.pull_request.head.repo.full_name == github.repository
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - name: Create, verify, and remove a test draft release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TARGET_SHA: ${{ github.event.pull_request.base.sha }}
              shell: bash
              run: |
                  TEST_TAG="workflow-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

                  cleanup() {
                      gh release delete "$TEST_TAG" \
                          --repo "$GITHUB_REPOSITORY" \
                          --yes \
                          --cleanup-tag >/dev/null 2>&1 || true
                  }
                  trap cleanup EXIT

                  gh release create "$TEST_TAG" \
                      --repo "$GITHUB_REPOSITORY" \
                      --target "$TARGET_SHA" \
                      --title "$TEST_TAG" \
                      --notes "Temporary draft release created to test the release workflow." \
                      --draft

                  IS_DRAFT="$(gh release view "$TEST_TAG" \
                      --repo "$GITHUB_REPOSITORY" \
                      --json isDraft \
                      --jq .isDraft)"

                  if [ "$IS_DRAFT" != "true" ]; then
                      echo "The test release was not created as a draft."
                      exit 1
                  fi

                  cleanup
                  trap - EXIT

                  if gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                      echo "The test release still exists after cleanup."
                      exit 1
                  fi

                  if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TEST_TAG}" >/dev/null 2>&1; then
                      echo "The test tag still exists after cleanup."
                      exit 1
                  fi
